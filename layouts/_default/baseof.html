<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{ partial "head.html" . }}

<body>
  {{ partial "header" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "extra/search.html" . }}
  {{ partial "footer.html" . }}
  <!-- Inline SVG sprite for icons (used by obsidian-callout) -->
  <div style="display: none;">
    {{ partial "symbols.html" . }}
  </div>
  {{ partial "script.html" . }}
  {{ partial "script/globalscript.html" . }}
</body>
</html>

<meta name="description"
  content="{{ if .IsHome }}{{ .Site.Params.tagline }}{{ else }}{{ .Summary | plainify }}{{ end }}" />
<meta name="keywords"
  content='{{ with .Params.Keywords }}{{ delimit . ", " }}{{ else }}{{ $.Site.Params.Keywords }}{{ end }}' />
<meta name="robots" content="noodp" />
<link rel="canonical" href="{{ .Permalink }}" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ if .IsHome }}{{ else }}{{ .Title }} - {{ end }}{{ .Site.Title }}" />
<meta name="twitter:description"
  content="{{ if .IsHome }}{{ $.Site.Params.description }}{{ else }}{{ .Summary | plainify }}{{ end }}" />
<meta name="twitter:site" content="{{ $.Site.BaseURL }}" />
<meta name="twitter:creator" content="{{ .Params.Author }}" />
<meta name="twitter:image"
  content="{{ if .IsHome }}{{ $.Site.Params.avatar | absURL }}{{ else }}{{ .Params.Cover | absURL }}{{ end }}">

<!-- OG data -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:title" content="{{ if .IsHome }}{{ else }}{{ .Title }} - {{ end }}{{ .Site.Title }}">
<meta property="og:description"
  content="{{ if .IsHome }}{{ $.Site.Params.description }}{{ else }}{{ .Summary | plainify }}{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ .Title }}" />
<meta property="og:image"
  content="{{ if .IsHome }}{{ $.Site.Params.avatar | absURL }}{{ else }}{{ .Params.Cover | absURL }}{{ end }}">
<meta property="og:image:width" content="2048">
<meta property="og:image:height" content="1024">
{{ if isset .Params "date" }}
<meta property="article:published_time" content="{{ time .Date }}" />
{{ end }}

<!-- RSS -->
{{ with .OutputFormats.Get "RSS" }}
<link href="{{ .RelPermalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" />
{{ end }}

<!-- JSON Feed -->
{{ with .OutputFormats.Get "json" }}
<link href="{{ .RelPermalink }}" rel="alternate" type="application/json" title="{{ $.Site.Title }}" />
{{ end }}

<!-- Google Analytics -->
{{ if eq (getenv "HUGO_ENV") "production"}}
{{ template "_internal/google_analytics.html" . }}
{{ end }}

<style>
  /* Wide Mode Overrides */
  html[data-wide-mode="true"] .container-lg,
  html[data-wide-mode="true"] .container-xl,
  html[data-wide-mode="true"] #waline {
    max-width: 95% !important;
    width: 95% !important;
  }

  html[data-wide-mode="true"] .application-main {
    max-width: none !important;
  }

  /* Ensure Waline matches default content width in normal mode */
  html:not([data-wide-mode="true"]) #waline {
    max-width: 1012px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Transitions for smooth resizing */
  .container-lg, .container-xl, #waline {
    transition: max-width 0.3s ease, width 0.3s ease;
  }

  /* Footnote Styles */
  .footnote-ref {
    vertical-align: super;
    font-size: 0.75em;
    margin-left: 2px;
  }
  .footnotes {
    margin-top: 40px;
    font-size: 0.9em;
    color: var(--color-fg-muted);
    border-top: 1px solid var(--color-border-default);
    padding-top: 20px;
  }
  .footnotes ol {
    padding-left: 20px;
  }
  .footnote-backref {
    font-family: sans-serif;
    text-decoration: none;
    margin-left: 4px;
  }
</style>

<script>
window.renderInlineFootnotes = function() {
  // Use a broad selector to catch titles and content
  const containers = document.querySelectorAll('main, .markdown-body');
  if (containers.length === 0) return;

  // We only want to process the main content once. 
  // If we have already added footnotes, don't do it again.
  if (document.querySelector('.footnotes')) return;

  let count = 1;
  const footnotes = [];

  // Use a more aggressive approach: iterate through all text nodes
  function processNode(node) {
    if (node.nodeType === 3) { // Text node
      const text = node.textContent;
      if (text.includes('^[')) {
        const regex = /\^\[(.*?)\]/g;
        let match;
        let lastIndex = 0;
        const fragment = document.createDocumentFragment();
        
        while ((match = regex.exec(text)) !== null) {
          // Add preceding text
          fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
          
          const content = match[1];
          const id = 'fnref-' + count;
          const fnId = 'fn-' + count;
          footnotes.push({ id: fnId, refId: id, content: content });
          
          const sup = document.createElement('sup');
          sup.className = 'footnote-ref';
          sup.id = id;
          const a = document.createElement('a');
          a.href = '#' + fnId;
          a.textContent = '[' + count + ']';
          sup.appendChild(a);
          fragment.appendChild(sup);
          
          count++;
          lastIndex = regex.lastIndex;
        }
        
        fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
        node.parentNode.replaceChild(fragment, node);
      }
    } else if (node.nodeType === 1 && !['PRE', 'CODE', 'A', 'SCRIPT', 'STYLE'].includes(node.tagName)) {
      // Create a static array of children to avoid issues with live modification
      const children = Array.from(node.childNodes);
      for (const child of children) {
        processNode(child);
      }
    }
  }

  // Find the primary container to walk through
  const main = document.querySelector('main') || document.body;
  processNode(main);

  if (footnotes.length > 0) {
    const footer = document.createElement('div');
    footer.className = 'footnotes';
    footer.innerHTML = '<hr><ol></ol>';
    const ol = footer.querySelector('ol');
    
    footnotes.forEach(fn => {
      const li = document.createElement('li');
      li.id = fn.id;
      li.innerHTML = fn.content + ' <a href="#' + fn.refId + '" class="footnote-backref">↩</a>';
      ol.appendChild(li);
    });
    
    // Append to the end of .markdown-body if exists, else to main
    const contentArea = document.querySelector('.markdown-body') || main;
    contentArea.appendChild(footer);
  }
};
</script>

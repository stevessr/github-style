<div class="footer container-xl width-full p-responsive">
  <div
    class="footer-columns"
    style="

      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2rem;
      padding: 2.5rem 0;
      margin-top: 3rem;
      border-top: 1px solid var(--color-border-default);
    "
  >
    <!-- Column 1: Theme and Copyright -->
    <div class="footer-column" style="flex: 1; min-width: 280px">
      <div class="d-flex flex-items-center mb-3">
        <a
          aria-label="Homepage"
          title="{{ .Site.Title }}"
          class="footer-octicon mr-3"
          href="{{ .Site.BaseURL }}"
        >
          <svg
            fill="var(--color-fg-muted)"
            height="24"
            class="octicon octicon-mark-github"
            viewBox="0 0 16 16"
            version="1.1"
            width="24"
          >
            <path
              fill-rule="evenodd"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            ></path>
          </svg>
        </a>
        <span class="f6" style="color: var(--color-fg-muted)"
          >&copy; {{ now.Format "2006" }} {{ .Site.Title }}</span
        >
      </div>
      <ul class="list-style-none f6" style="color: var(--color-fg-muted)">
        <li class="mb-2">
          Theme by
          <a href="https://github.com/MeiK2333/github-style">github-style</a>
        </li>
        <li class="mb-2">
          Powered by <a href="https://gohugo.io/" target="_blank">Hugo</a>
        </li>
      </ul>
    </div>

    <!-- Column 2: Personal Info -->
    <div class="footer-column" style="flex: 1; min-width: 280px">
      <h4 style="font-weight: 600; color: var(--color-fg-default)">
        Contact & Info
      </h4>
      <ul class="list-style-none f6" style="color: var(--color-fg-muted)">
        <li class="mb-2">
          📧 Email:
          <a href="mailto:steve-ssr@outlook.com">steve-ssr@outlook.com</a>
        </li>
        <li class="mb-2">
          🌐 Website:
          <a href="https://stevessr.eu.org" target="_blank"
            >https://stevessr.eu.org</a
          >
        </li>
        <li class="mb-2">
          🌐 Website:
          <a href="https://aaca.eu.org" target="_blank">https://aaca.eu.org</a>
        </li>
      </ul>
    </div>
  </div>
  <div center class="text-center f6" style="color: var(--color-fg-muted)">
    <li class="mb-2">
      <a href="https://icp.gov.moe/?keyword=20240144" target="_blank"
        >萌ICP备20240144号</a
      >
    </li>
  </div>
</div>
